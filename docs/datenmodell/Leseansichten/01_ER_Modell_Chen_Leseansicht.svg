<text x="46" y="1018" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#52636B" text-anchor="start">(min,max) gilt je Instanz der angrenzenden Entität. 0 = optional; N = beliebig viele. Breite Linie = vollständige Teilnahme.</text>
<text x="46" y="1041" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#52636B" text-anchor="start">Album → Künstler: Minimum 0, weil die App fehlende Metadaten zulässt. Technische Cachefelder und Zeitstempel stehen im Tabellenmodell.</text>
